<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Painel · Essencialli</title>
  <meta name="theme-color" content="#ad72b4">
  <link rel="icon" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=202610041854">
  <link rel="stylesheet" href="assets/admin.css?v=202610041854">
  <script src="config.js?v=202610041854"></script>
  <script type="module" src="assets/admin.js?v=202610041854"></script>
</head>
<body class="adm">
  <div class="demo-bar" id="demo" hidden>Modo demonstração: qualquer e-mail e senha entram, e os dados ficam só neste navegador.</div>

  <!-- Login -->
  <section class="login" id="telaLogin" hidden>
    <form class="login-caixa" id="formLogin">
      <img class="login-logo" src="assets/logo.png" alt="">
      <p class="marca-nome">Essencialli</p>
      <p class="marca-sub">Painel da equipe</p>
      <label>E-mail<input type="email" id="loginEmail" autocomplete="username" required></label>
      <label>Senha<input type="password" id="loginSenha" autocomplete="current-password" required></label>
      <button class="btn btn-escuro" type="submit" id="btnEntrar">Entrar</button>
      <p class="login-erro" id="loginErro" hidden></p>
    </form>
  </section>

  <!-- Painel -->
  <div class="painel" id="telaPainel" hidden>
    <header class="adm-topo">
      <div class="marca">
        <img class="marca-logo" src="assets/logo.png" alt="">
        <span class="marca-nome">Essencialli</span>
        <span class="marca-sub">Painel da equipe</span>
      </div>
      <nav class="abas" id="abas">
        <button data-aba="produtos" class="ativa">Perfumes</button>
        <button data-aba="pedidos">Pedidos</button>
        <button data-aba="relatorios">Relatórios</button>
        <button data-aba="config">Configurações</button>
      </nav>
      <div class="adm-topo-acoes">
        <a href="index.html" target="_blank" class="link-claro">Ver catálogo ↗</a>
        <button class="link-claro" id="btnSair">Sair</button>
      </div>
    </header>

    <main class="adm-main">
      <section id="abaProdutos"></section>
      <section id="abaPedidos" hidden></section>
      <section id="abaRelatorios" hidden></section>
      <section id="abaConfig" hidden></section>
    </main>
  </div>

  <!-- Editor de perfume -->
  <div class="modal" id="modalEditor" hidden role="dialog" aria-modal="true">
    <form class="modal-caixa editor" id="formEditor" novalidate></form>
  </div>

  <!-- Confirmação -->
  <div class="modal" id="modalConfirma" hidden role="dialog" aria-modal="true">
    <div class="modal-caixa confirma">
      <p id="confirmaTexto"></p>
      <div class="confirma-botoes">
        <button class="btn btn-linha" id="confirmaNao">Cancelar</button>
        <button class="btn btn-perigo" id="confirmaSim">Excluir</button>
      </div>
    </div>
  </div>

  <input type="file" id="arquivoLote" accept="image/*" multiple hidden>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
